server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # —— gzip ——
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ============================================================
    # HTTP 安全头（详见 .ai/SECURITY.md §6）
    # ============================================================

    # —— 安全头（基线，所有响应） ——
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # —— HSTS（仅 HTTPS 时启用；在内网 / LB 后方由上游网关添加，主 nginx 80 端口不强制） ——
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ============================================================
    # CSP（Content-Security-Policy）
    #   ProComponents 需要 unsafe-inline / unsafe-eval（antd v5 注入样式）；
    #   dev 时允许 'unsafe-eval'；生产建议收紧（见 SECURITY.md §6）
    # ============================================================
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # —— 静态资源长缓存（hash 文件名） ——
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # —— API 反向代理到后端（容器内 gateway 服务名 · Phase 3） ——
    # 注意：不 rewrite——gateway 路由就是 /api/auth/**、/api/iot/**（与 vite proxy 一致），
    # proxy_pass 不带尾部斜杠，保留 /api 前缀原样转发（带 / 会剥掉前缀 → gateway 404）
    location /api/ {
        proxy_pass http://gateway:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering       off;
    }

    # —— 容器内健康探针 ——
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # —— SPA fallback：所有未匹配路径交给 index.html ——
    location / {
        try_files $uri $uri/ /index.html;
    }
}
